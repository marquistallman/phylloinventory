# =====================================================================
#  Cactus Inventory — Microservicios
#
#  Perfiles:
#    default (sin profile) -> postgres, kalman-worker, needle-service, api-gateway, kokoro-service
#    --profile with-voice      -> agrega voice-service (Whisper local para STT)
#    --profile with-openrouter -> agrega openrouter-service y lo selecciona como backend LLM
#    --profile with-elevenlabs -> agrega elevenlabs-service (STT + TTS cloud)
#
#  Uso:
#    docker compose up -d                                            # minimo (needle + kokoro)
#    docker compose --profile with-voice up -d                       # + voz local
#    docker compose --profile with-elevenlabs up -d                  # + STT/TTS cloud
#    docker compose --profile with-openrouter --profile with-elevenlabs up -d  # todo cloud
#
#  LLM_BACKEND=needle|openrouter cambia el backend por env (default needle)
#  CLOUD_ENABLED=true|false        activa el toggle runtime por env (tambien via POST /api/config)
# =====================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # -------------------------------------------------------------------
  #  PostgreSQL — DB + cola pending_evaluations + funciones puras
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: cactus_postgres
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: cactus
      POSTGRES_PASSWORD: cactus
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cactus -d inventario"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - cactus_net
    logging: *default-logging

  # -------------------------------------------------------------------
  #  kalman-worker (Go) — consume la cola y evalua Kalman
  # -------------------------------------------------------------------
  kalman-worker:
    build:
      context: ./kalman-worker
      dockerfile: Dockerfile
    container_name: cactus_kalman_worker
    environment:
      DATABASE_URL: postgres://cactus:cactus@postgres:5432/inventario?sslmode=disable
      KALMAN_WORKERS: "8"                # goroutines worker (sobra para demo)
      POLL_INTERVAL: "200ms"
      HTTP_ADDR: ":8300"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8300:8300"
    networks:
      - cactus_net
    logging: *default-logging

  # -------------------------------------------------------------------
  #  needle-service — modelo 26M on-device
  # -------------------------------------------------------------------
  needle-service:
    build:
      context: .
      dockerfile: services/needle_svc/Dockerfile
    container_name: cactus_needle
    environment:
      DATABASE_URL: postgres://cactus:cactus@postgres:5432/inventario?sslmode=disable
      CHECKPOINT_PATH: /app/checkpoints/needle.pkl
      MAX_INFER_INFLIGHT: "4"
      UVICORN_WORKERS: "1"
    volumes:
      - needle_checkpoints:/app/checkpoints
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - cactus_net
    logging: *default-logging

  # -------------------------------------------------------------------
  #  openrouter-service — backend alternativo (perfil with-openrouter)
  # -------------------------------------------------------------------
  openrouter-service:
    profiles: ["with-openrouter"]
    build:
      context: .
      dockerfile: services/openrouter/Dockerfile
    container_name: cactus_openrouter
    environment:
      DATABASE_URL: postgres://cactus:cactus@postgres:5432/inventario?sslmode=disable
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE: ${OPENROUTER_BASE:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-deepseek/deepseek-v4-flash}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"
    networks:
      - cactus_net
    logging: *default-logging

  # -------------------------------------------------------------------
  #  api-gateway — punto de entrada para la CLI
  # -------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: cactus_api_gateway
    environment:
      DATABASE_URL: postgres://cactus:cactus@postgres:5432/inventario?sslmode=disable
      LLM_BACKEND: ${LLM_BACKEND:-needle}
      STT_BACKEND: ${STT_BACKEND:-whisper}
      TTS_BACKEND: ${TTS_BACKEND:-kokoro}
      CLOUD_ENABLED: ${CLOUD_ENABLED:-false}
      NEEDLE_URL: http://needle-service:8081
      OPENROUTER_URL: http://openrouter-service:8082
      VOICE_URL: http://voice-service:8100
      KOKORO_URL: http://kokoro-service:8205
      ELEVENLABS_URL: http://elevenlabs-service:8206
    depends_on:
      postgres:
        condition: service_healthy
      kalman-worker:
        condition: service_started
      needle-service:
        condition: service_started
    ports:
      - "8200:8200"
    networks:
      - cactus_net
    logging: *default-logging

  # -------------------------------------------------------------------
  #  kokoro-service — TTS (Kokoro 82M/84M, streaming por oracion)
  # -------------------------------------------------------------------
  kokoro-service:
    build:
      context: .
      dockerfile: services/kokoro_svc/Dockerfile
    container_name: cactus_kokoro
    environment:
      LANG_CODE: ${KOKORO_LANG:-e}      # 'e' = espanol
      VOICE:     ${KOKORO_VOICE:-ef_dora}
      SPEED:     ${KOKORO_SPEED:-1.0}
      PORT:      "8205"
    ports:
      - "8205:8205"
    networks:
      - cactus_net
    logging: *default-logging

  # -------------------------------------------------------------------
  #  voice-service — WebSocket STT (perfil with-voice)
  # -------------------------------------------------------------------
  voice-service:
    profiles: ["with-voice"]
    build:
      context: .
      dockerfile: services/voice/Dockerfile
    container_name: cactus_voice
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_LANGUAGE: es
      VOICE_SILENCE_RMS: "0.01"
      VOICE_SILENCE_SECS: "0.8"
    ports:
      - "8100:8100"
    networks:
      - cactus_net
    logging: *default-logging

  # -------------------------------------------------------------------
  #  elevenlabs-service — STT + TTS cloud (perfil with-elevenlabs)
  # -------------------------------------------------------------------
  elevenlabs-service:
    profiles: ["with-elevenlabs"]
    build:
      context: .
      dockerfile: services/elevenlabs/Dockerfile
    container_name: cactus_elevenlabs
    environment:
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_BASE: ${ELEVENLABS_BASE:-https://api.elevenlabs.io}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-21m00Tcm4TlvDq8ikWAM}
      ELEVENLABS_STT_MODEL: ${ELEVENLABS_STT_MODEL:-scribe_v1}
      ELEVENLABS_TTS_MODEL: ${ELEVENLABS_TTS_MODEL:-eleven_multilingual_v2}
      ELEVENLABS_TTS_OUTPUT: ${ELEVENLABS_TTS_OUTPUT:-pcm_24000}
      PORT: "8206"
    ports:
      - "8206:8206"
    networks:
      - cactus_net
    logging: *default-logging

volumes:
  pgdata:
  needle_checkpoints:

networks:
  cactus_net:
    driver: bridge
